<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이준서 자기소개</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: linear-gradient(135deg, #e0f2fe, #f0f9ff);
      color: #1e293b;
      overflow-x: hidden;
    }

    .card {
      width: 100%;
      max-width: 360px;
      padding: 36px 24px;
      background-color: #ffffff;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(30, 64, 175, 0.12);
    }

    .emoji {
      font-size: 76px;
      line-height: 1.3;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .intro {
      margin: 0;
      color: #64748b;
      font-size: 15px;
      line-height: 1.8;
      word-break: keep-all;
    }

    .tags {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin: 26px 0;
    }

    .tag {
      padding: 9px 15px;
      border-radius: 999px;
      background-color: #e0f2fe;
      color: #0369a1;
      font-size: 14px;
      font-weight: 600;
    }

    .github-button {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      background-color: #2563eb;
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      transition: background-color 0.2s, transform 0.2s;
    }

    .github-button:hover {
      background-color: #1d4ed8;
      transform: translateY(-2px);
    }

    .github-button:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 4px;
    }

    @media (max-width: 380px) {
      .card {
        padding: 30px 20px;
      }

      .emoji {
        font-size: 64px;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="emoji" aria-label="파도">🌊</div>

    <h1>이준서</h1>

    <p class="intro">
      피아노를 좋아하는 고등학교 2학년입니다.
    </p>

    <div class="tags" aria-label="좋아하는 것">
      <span class="tag">🎹 피아노</span>
      <span class="tag">📷 촬영</span>
      <span class="tag">🎵 음악</span>
    </div>

    <a
      class="github-button"
      href="https://github.com/your-username"
      target="_blank"
      rel="noopener noreferrer"
    >
      내 깃허브 ↗
    </a>
  </main>
</body>
</html>
