<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#10182d">
  <title>JUNSEO'S MINI ARCADE</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 42px 20px;
      color: #f5f7ff;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(75, 111, 220, .22), transparent 32%),
        radial-gradient(circle at 90% 80%, rgba(80, 65, 180, .18), transparent 30%),
        #0b1020;
    }
    .container { width: min(100%, 1040px); margin: 0 auto; }
    header { text-align: center; margin: 18px 0 48px; }
    .eyebrow {
      display: inline-block;
      padding: 9px 16px;
      border: 1px solid rgba(147, 174, 255, .35);
      border-radius: 999px;
      color: #b9ccff;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    h1 {
      margin: 22px 0 12px;
      font-size: clamp(32px, 6vw, 54px);
      letter-spacing: -2px;
    }
    .intro { margin: 0; color: #aab5ce; line-height: 1.8; font-size: 15px; }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .section-head h2 { margin: 0; font-size: 21px; }
    .count {
      color: #aab5ce;
      font-size: 13px;
      white-space: nowrap;
    }
    .game-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }
    .game-card {
      display: flex;
      flex-direction: column;
      min-height: 290px;
      padding: 24px;
      border: 1px solid rgba(169, 188, 235, .16);
      border-radius: 22px;
      background: linear-gradient(155deg, rgba(255,255,255,.09), rgba(255,255,255,.035));
      box-shadow: 0 14px 40px rgba(0,0,0,.16);
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }
    .game-card:hover {
      transform: translateY(-6px);
      border-color: rgba(126, 162, 255, .65);
      background: linear-gradient(155deg, rgba(90,126,220,.19), rgba(255,255,255,.05));
    }
    .game-icon {
      display: grid;
      place-items: center;
      width: 64px;
      height: 64px;
      margin-bottom: 21px;
      border-radius: 18px;
      background: rgba(116, 148, 255, .15);
      font-size: 34px;
    }
    .game-card h3 { margin: 0 0 10px; font-size: 21px; }
    .game-card p {
      flex: 1;
      margin: 0 0 24px;
      color: #aeb9d1;
      font-size: 14px;
      line-height: 1.7;
      word-break: keep-all;
    }
    .play-link {
      display: block;
      padding: 13px 16px;
      border-radius: 12px;
      color: white;
      background: #557cf2;
      text-align: center;
      text-decoration: none;
      font-size: 14px;
      font-weight: 700;
      transition: background .2s ease, transform .2s ease;
    }
    .play-link:hover { background: #7092ff; }
    .play-link:active { transform: scale(.98); }
    footer {
      margin-top: 58px;
      color: #6f7c99;
      text-align: center;
      font-size: 12px;
      line-height: 1.8;
    }
    @media (max-width: 760px) {
      .game-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 520px) {
      body { padding: 28px 16px; }
      header { margin: 12px 0 36px; }
      .game-grid { grid-template-columns: 1fr; gap: 14px; }
      .game-card { min-height: 250px; padding: 22px; }
      .section-head h2 { font-size: 19px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <div class="eyebrow">JUNSEO'S MINI ARCADE</div>
      <h1>나의 게임 아케이드 🎮</h1>
      <p class="intro">
        직접 만든 게임을 한곳에서 즐겨보세요.<br>
        새로운 게임도 계속 추가할 예정입니다!
      </p>
    </header>

    <section aria-labelledby="game-list-title">
      <div class="section-head">
        <h2 id="game-list-title">🕹️ 게임 목록</h2>
        <span class="count" id="gameCount"></span>
      </div>
      <div class="game-grid" id="gameGrid"></div>
    </section>

    <footer>
      MADE BY JUNSEO<br>
      나만의 작은 게임 아케이드
    </footer>
  </main>

  <script>
    // 새 게임을 추가할 때 아래 형식으로 한 항목을 더 작성하세요.
    // file에는 실제 HTML 파일명을 정확히 입력해야 합니다.
    const games = [
      {
        title: "반응속도 테스트",
        description: "화면이 초록색으로 바뀌는 순간을 포착하세요! 5번 측정해 평균 반응속도와 등급을 확인할 수 있습니다.",
        icon: "⚡",
        file: "game1.html"
      },
      {
        title: "나만의 메모리 게임",
        description: "카드를 뒤집어 같은 그림 8쌍을 찾아보세요. 뒤집은 횟수와 걸린 시간도 확인할 수 있습니다.",
        icon: "🧠",
        file: "game2.html"
      },
      {
        title: "우주 생존 게임",
        description: "우주선을 움직여 떨어지는 운석을 피하세요! 목숨 3개로 최대한 오래 살아남아 보세요.",
        icon: "🚀",
        file: "game3.html"
      }
    ];

    const gameGrid = document.getElementById("gameGrid");
    const gameCount = document.getElementById("gameCount");

    games.forEach((game) => {
      const card = document.createElement("article");
      card.className = "game-card";

      const icon = document.createElement("div");
      icon.className = "game-icon";
      icon.textContent = game.icon;

      const title = document.createElement("h3");
      title.textContent = game.title;

      const description = document.createElement("p");
      description.textContent = game.description;

      const link = document.createElement("a");
      link.className = "play-link";
      link.href = game.file;
      link.textContent = "게임 시작하기 →";
      link.setAttribute("aria-label", game.title + " 시작하기");

      card.append(icon, title, description, link);
      gameGrid.appendChild(card);
    });

    gameCount.textContent = `등록된 게임 ${games.length}개`;
  </script>
</body>
</html>
